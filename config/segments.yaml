# =============================================================================
# Part 9 - Knowledge-based suitability config (7 agro-market segments)
# -----------------------------------------------------------------------------
# Per segment: the relevant factors, a fuzzy MEMBERSHIP shape standardizing each
# to [0,1], and an AHP weight. Suitability is the weighted GEOMETRIC mean of the
# memberships (limiting-factor behaviour), or the weighted ARITHMETIC mean for a
# compensatory value index (conservation), then masked and classified into FAO
# S1/S2/S3/N.
#
# WEIGHTS ARE MACHINE-WRITTEN. Every `weight:` below is derived by
# tools/derive_weights.py from the literature-anchored pairwise judgements in
# config/ahp_matrices.yaml:
#
#     anchors -> Saaty matrix -> principal eigenvector (w_lit)
#             -> w = normalize(w_lit * sigma(mu) ** lambda_regional)
#
# Do not edit a weight by hand; `derive_weights.py --check` fails if one drifts.
# The derivation and its crossing to the literature are documented in
# docs/ahp_literatura.md.
#
# Membership `type`:
#   increasing  points:[a,b]        0 below a, ramp to 1 at b, 1 above
#   decreasing  points:[a,b]        1 below a, ramp to 0 at b, 0 above
#   range       points:[a,b,c,d]    ramp up a->b, plateau b..c, ramp down c->d
# Slope is in DEGREES (stack band terr_slope).
#
# Per-factor fields:
#   weight   machine-written (above)
#   role     `limiting` -> the only role there is. EVERY factor enters the AHP
#                        matrix and the weighted aggregation. The former `gate`
#                        role -- a factor pulled out of the matrix by the test
#                        sigma(mu) < 0.05 AND mean(mu) > 0.95 and re-applied as a
#                        multiplicative gate -- was removed on 2026-10-02. The
#                        single regional rule covers that case on its own, by
#                        measuring sigma(mu) over the PRESENT union the FUTURE
#                        (SSP5-8.5, 2051-2070) instead of the present alone: a
#                        factor saturated today but moving under warming earns a
#                        weight from measured gradation, not from an author
#                        exemption. Breakpoints are still anchored so the present
#                        value gives mu = 1, which is what removes the hidden
#                        deflator a constant mu < 1 would apply against the
#                        ABSOLUTE FAO cuts. Full argument in the header of
#                        config/ahp_matrices.yaml.
#   basis    `literatura` or `empirico`: how the BREAKPOINTS were set.
#            `empirico` means anchored to the percentile distribution actually
#            observed in GO/DF; see thesis/Chapters/breakpoint_anchoring.csv.
#   source   bib key backing the breakpoints, when basis is `literatura`
#   locator  table/page inside that source
#   note     atemporal justification of the shape and its thresholds
#
# `mask` policy (uses the feat_landcover masks):
#   available    -> keep only generic-convertible land (mask_available)
#   exclude_only -> drop only built-up/water/wetland (mask_excluded)
#   none         -> unmasked (conservation: a conservation-VALUE index over all land)
#
# GUARDRAIL: land cover is mask/context/validation only, never a suitability or
# clustering input. The single sanctioned exception is conservation's demoted,
# supportive `rl_native_frac`. The `sit_` (siting) and `cv_` (conservation-value)
# factors are biophysical/governance layers, NOT land use.
# =============================================================================

fao_classes:
  breaks: [0.25, 0.50, 0.75]      # N < .25 <= S3 < .50 <= S2 < .75 <= S1
  codes: {N: 0, S3: 1, S2: 2, S1: 3}

aggregation:
  epsilon: 0.001                  # membership floor -> finite log; strong (not fatal) limiting penalty
  sensitivity_delta: 0.20         # +/-20% one-at-a-time AHP weight perturbation (robustness band)
  lambda_regional: 0.5            # w = normalize(w_lit * sigma(mu)^lambda); fixed a priori, NOT tuned

# Band-name prefixes routed to a side image instead of feature_stack_250m
# (src/membership._source_image). Declared here as config rather than asserted
# in prose; membership.suit_present validates that each prefix has an image.
extras_prefixes:
  lc_: feat_landcover             # masks + descriptive fractions
  sit_: feat_siting               # solar clearness / pisciculture seasonal-water distance
  cv_: feat_conservation          # WDPA distance / ruggedness / biomass carbon
  rl_: feat_realized              # conservation's sanctioned native-vegetation fraction

segments:

  soybean:
    label: Soja
    mask: available
    factors:
      terr_slope:
        weight: 0.374          # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [4, 8]
        basis: empirico
        note: >-
          Declividade em graus; limita a mecanizacao e favorece a erosao. Os limiares cobrem a cauda
          declivosa da terra DISPONIVEL (p5-p95 1,8-8,8 graus; p50 3,4): mu comeca a cair em 4 graus e
          zera em 8. Sao mais largos que o nicho realizado da soja (p95 5,3 graus) -- nao foram
          ajustados a ele, e nenhuma informacao de uso realizado entra no valor.
      soil_clay:
        weight: 0.2424         # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [20, 32, 45, 62]
        basis: empirico
        note: >-
          Teor de argila (%); solos arenosos retem menos agua e nutrientes. Ancorado na distribuicao da
          terra DISPONIVEL: a = 20 (p5 21,1), b = 32 (p50 31,9), c = 45 (p95 45,1), com a cauda superior
          estendida ate 62 porque os Latossolos argilosos do Cerrado nao sao limitantes para a soja. O
          ombro c valia 48 -- o p95 do nicho REALIZADO da soja (48,4) --, unico ponto dos sete limiares
          desta revisao que seguia o uso realizado em vez da terra disponivel; foi realinhado ao p95
          disponivel.
      clim_twarm_q:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: range
        points: [18, 22, 30, 34]
        basis: empirico
        note: >-
          Temperatura media do trimestre mais quente (C); o otimo termico da soja situa-se em torno de
          20-30 C. Em GO/DF a distribuicao observada (23,6-27,6 C) cai INTEIRAMENTE dentro do plato
          otimo, de modo que mu = 1 em toda a area e sigma(mu) = 0 NO PRESENTE: hoje o fator nao
          distingue celula alguma. Nao e uma limitacao do dado, e um achado -- o clima de GO/DF esta
          dentro da faixa otima quase em todo lugar, e por isso habilita em vez de graduar. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          Aqui a alavanca e o ombro superior (c = 30), que morde sob aquecimento.
      soil_ph:
        weight: 0.3836         # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [4.5, 5.5, 6.8, 7.5]
        basis: empirico
        note: "pH em agua; solos acidos corrigiveis por calagem ate a faixa neutra."
      clim_pr_annual:
        weight: 0.0           # machine-written by tools/derive_weights.py
        type: range
        points: [800, 1100, 1800, 2200]
        basis: empirico
        note: >-
          Precipitacao anual (mm) como proxy da lamina sazonal. Em GO/DF a distribuicao observada
          (1375-1637 mm) cai INTEIRAMENTE dentro do plato otimo, de modo que mu = 1 em toda a area e
          sigma(mu) = 0 NO PRESENTE. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao. A alavanca e o ombro
          inferior (b = 1100): se a chuva projetada se aproximar dele, o fator gradua e ganha peso.
      clim_aridity:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: range
        points: [0.4, 0.7, 1.3, 1.6]
        basis: empirico
        note: >-
          Indice de aridez P/PET; suficiencia hidrica. Em GO/DF o observado sobre a terra disponivel vai
          de 0,83 a 1,26 e cai quase todo dentro do plato otimo: sigma(mu) = 0,026 e mu medio = 0,992
          no presente. O ombro superior foi movido de 1,2 para 1,3 -- acima do maximo observado (1,26)
          -- para que o valor presente de mu = 1 em toda a area, removendo o deflator residual que um
          mu quase constante < 1 aplicaria contra os cortes ABSOLUTOS da FAO. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          A alavanca fica no ombro INFERIOR (b = 0,7, contra um minimo observado de 0,83): se o
          Cerrado secar, o fator gradua.

  sugarcane:
    label: Cana-de-açúcar
    mask: available
    factors:
      terr_slope:
        weight: 0.3022         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [5, 10]
        basis: empirico
        note: >-
          Declividade em graus; a colheita mecanizada da cana exige terreno plano. Limiares (5, 10) mais
          largos que a terra disponivel (p5-p95 1,8-8,8 graus) e bem mais largos que o nicho realizado
          da cana (p95 4,8 graus): a forma vem da exigencia de mecanizacao, nao do uso observado.
      soil_awc:
        weight: 0.318          # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points:
        - 22.1
        - 33.6
        basis: empirico
        note: >-
          Agua disponivel no solo (% vol a 33 kPa, 0-30 cm); a cana e exigente em armazenamento hidrico. Limiares no intervalo p5-p95 observado em GO/DF (22,1-33,6): a faixa anterior (5-20) ficava inteiramente ABAIXO da distribuicao real, saturando o fator em mu = 1 em 99,3% da terra disponivel.
      soil_clay:
        weight: 0.3798         # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [22, 32, 52, 66]
        basis: empirico
        note: >-
          Teor de argila (%); penaliza solos arenosos. Ancorado na terra DISPONIVEL: a = 22 (p5 21,1),
          b = 32 (p50 31,9); o plato segue ate 52 e a queda ate 66, acima do p95 disponivel (45,1) e do
          realizado (45,6), porque solo argiloso nao limita a cana. Nenhum limiar segue o nicho realizado.
      clim_twarm_q:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: range
        points: [20, 23, 32, 36]
        basis: empirico
        source: aparecido_climate_2021
        locator: "p. 778"
        note: >-
          Temperatura media do trimestre mais quente (C); a cana e uma C4 termofila, com desenvolvimento
          favorecido em regime tropical quente -- a FORMA intervalar e os limiares 20/32/36 vem de
          Aparecido et al. Em GO/DF o observado sobre a terra disponivel vai de 23,0 a 28,2 C e cai quase
          todo dentro do plato: sigma(mu) = 0,039 e mu medio = 0,988 no presente. O ombro inferior foi
          movido de 24 para 23 -- abaixo do minimo observado -- para que o valor presente de mu = 1; por
          isso `basis` passa a `empirico`, embora a fonte permaneca registrada. Numa revisao anterior o
          fator carregava o MAIOR peso do segmento (0,3024) enquanto contribuia ~0,996 para a media
          geometrica: peso sem poder discriminante, diluindo declive, CAD e argila. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          A alavanca e o ombro superior (c = 32), que morde se o trimestre mais quente aquecer cerca
          de 4 C.
      clim_pr_annual:
        weight: 0.0           # machine-written by tools/derive_weights.py
        type: range
        points: [900, 1300, 2000, 2600]
        basis: literatura
        source: aparecido_climate_2021
        locator: "p. 778"
        note: >-
          Precipitacao anual (mm). Aparecido et al. situam 1100-1500 mm bem distribuidos como adequados
          ao ciclo, e declaram a agua o principal fator limitante do rendimento da cana (p. 777). Em
          GO/DF a distribuicao observada (1375-1637 mm) cai quase toda dentro do plato otimo:
          sigma(mu) = 0,014 e mu medio = 0,998 no presente. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          A alavanca e o ombro inferior (b = 1300), que esta DENTRO da faixa observada -- este fator
          ja gradua hoje na borda seca do estado.
      clim_dry_months:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: range
        points: [3, 5, 5, 9]
        basis: empirico
        note: >-
          Meses secos por ano. Quase CONSTANTE (=5) em GO/DF, com sigma(mu) = 0,014 no presente. Os
          limiares estao ancorados de modo que o valor presente de mu = 1, removendo o deflator
          oculto. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao. O fator e de otimo intermediario, e por isso
          responde em QUALQUER direcao: poucos meses secos demais suprimem a janela de maturacao,
          muitos demais impoem estresse hidrico.

  other_crops:
    label: Outras culturas anuais (milho/algodão/sorgo)
    mask: available
    factors:
      terr_slope:
        weight: 0.1223         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [4, 8]
        basis: empirico
        note: >-
          Declividade em graus; limita a mecanizacao. Limiares (4, 8) cobrem a cauda declivosa da terra
          DISPONIVEL (p5-p95 1,8-8,8 graus), mais largos que o nicho realizado (p95 5,4 graus).
      soil_soc:
        weight: 0.5378         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [6, 20]
        basis: empirico
        note: "Carbono organico do solo (g/kg) como proxy de fertilidade."
      clim_gdd:
        weight: 0.1374         # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [2500, 3500, 5500, 7000]
        basis: literatura
        source: mcmaster_growing_1997
        note: "Graus-dia acumulados, base 10 C; soma termica do ciclo."
      soil_ph:
        weight: 0.1649         # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [4.5, 5.5, 6.8, 7.5]
        basis: empirico
        note: "pH em agua; janela de disponibilidade de nutrientes."
      clim_pr_annual:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: range
        points: [700, 1000, 1700, 2200]
        basis: literatura
        source: amaral_metodologia_2023
        locator: "p. 258"
        note: >-
          Precipitacao anual (mm) como proxy da lamina sazonal; o ZARC-milho situa o consumo do ciclo
          em 400-700 mm. Em GO/DF a distribuicao observada (1375-1637 mm) cai INTEIRAMENTE dentro do
          plato otimo, de modo que mu = 1 em toda a area e sigma(mu) = 0 NO PRESENTE. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          A alavanca e o ombro inferior (b = 1000); a safrinha e o uso mais exposto, porque depende
          do prolongamento da estacao chuvosa, nao do total anual.
      clim_pr_cv:
        weight: 0.0376         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [0.6, 1.3]
        basis: empirico
        note: >-
          Coeficiente de variacao da precipitacao; confiabilidade da chuva. Praticamente uniforme em
          GO/DF (~0,82).

  pisciculture:
    label: Piscicultura (tanques/reservatórios)
    mask: available
    factors:
      terr_slope:
        weight: 0.1101         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [2.86, 5.71]
        basis: literatura
        source: francisco_classification_2019
        locator: "tab. 5, p. 9"
        note: >-
          Declividade em graus; viveiros escavados exigem terreno plano. A fonte da 0,4113 para
          <=2%, 0,3800 para 2-5%, 0,1475 para 5-10% e 0,0611 acima de 10%: a aptidao cai entre 5% e
          10%, que e o intervalo adotado (2,86 e 5,71 graus). Assefa (>8% ja inadequado) e o valor
          rejeitado, por avaliar outro sistema produtivo.
      soil_clay:
        weight: 0.1395         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [15, 35]
        basis: empirico
        note: "Teor de argila (%); solos argilosos retem a agua do viveiro."
      sit_water_dist_seas:
        weight: 0.4815         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [750, 6000]
        basis: empirico
        note: >-
          Distancia (m) a agua semipermanente (ocorrencia GSW > 50%), roteada de feat_siting pelo
          prefixo sit_. A agua permanente esta a 13,6 km da mediana em GO/DF, longe demais para
          discriminar; a semipermanente esta a 2,3 km.
      water_drain_density:
        weight: 0.0525         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points:
        - 0.0
        - 0.093
        basis: empirico
        note: >-
          Densidade de drenagem (fracao de celulas de curso d'agua); disponibilidade hidrica local. Banda fortemente zero-inflada a 250 m (p50 = 0, p75 = 0,013, p90 = 0,093): limiares ancorados em p5-p90. VER RESSALVA no relatorio de revisao -- sob a media geometrica um zero estrutural ainda atua como veto, e o zero aqui significa 'sem celula de curso d'agua mapeada nesta resolucao', nao 'sem agua'.
      clim_twarm_q:
        weight: 0.2164        # machine-written by tools/derive_weights.py
        role: limiting
        type: range
        points: [22, 26, 32, 36]
        basis: empirico
        note: "Temperatura media do trimestre mais quente (C); a tilapia e de agua morna."

  cattle:
    label: Pecuária / pastagem cultivada
    mask: exclude_only
    factors:
      clim_pr_annual:
        weight: 0.0           # machine-written by tools/derive_weights.py
        type: range
        points: [700, 1000, 2000, 2600]
        basis: empirico
        note: >-
          Precipitacao anual (mm). Em GO/DF a distribuicao observada (1375-1637 mm) cai INTEIRAMENTE
          dentro do plato otimo, de modo que mu = 1 em toda a area e sigma(mu) = 0 NO PRESENTE. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          Balew et al. dao a chuva o maior peso da coluna do gado (0,3375), usando-a como proxy da
          umidade do solo, que aqui e medida diretamente -- as duas partilham faixa na matriz.
      clim_dry_months:
        weight: 0.0            # machine-written by tools/derive_weights.py
        type: decreasing
        points: [5, 9]
        basis: empirico
        note: >-
          Meses secos por ano. Espacialmente CONSTANTE (=5) em GO/DF, com sigma(mu) = 0 no presente e
          limiares ancorados de modo que o valor presente de mu = 1. O peso vem de sigma(mu) medido no HORIZONTE (presente U SSP5-8.5 2051-2070), nao no presente: e a gradacao que o fator percorre dentro do horizonte da analise que lhe da peso, por medida e nao por excecao.
          Diferentemente da cana, aqui a direcao e monotona: mais meses secos reduzem a oferta de
          forragem, e e esse o vazio forrageiro da seca que determina a taxa de lotacao.
      clim_soil_moist:
        weight: 0.6969         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [55, 120]
        basis: empirico
        note: >-
          Umidade do solo (mm); graduador primario de forragem. Limiares (55, 120) praticamente
          coincidentes com o intervalo p5-p95 da terra DISPONIVEL (50,7-121,3), e nao com a cauda seca do
          pasto realizado: o uso observado nao entra no valor.
      terr_slope:
        weight: 0.1719        # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [6, 15]
        basis: empirico
        note: "Declividade em graus; encostas moderadas ja reduzem a capacidade de suporte."
      soil_soc:
        weight: 0.1312         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [8, 18]
        basis: empirico
        note: >-
          Carbono organico do solo (g/kg); graduador primario de fertilidade e forragem. Limiares (8, 18)
          praticamente coincidentes com o intervalo p5-p95 da terra DISPONIVEL (8,7-18,7); o nicho do
          pasto realizado (8,6-17,6) e quase identico porque o pasto cobre a maior parte do estado, de
          modo que a coincidencia nao e ancoragem no uso realizado.

  conservation:
    label: Conservação de floresta & Cerrado
    mask: none
    aggregate: arithmetic   # compensatory weighted linear combination
    factors:
      cv_pa_dist:
        weight: 0.3522         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [5000, 40000]
        basis: empirico
        note: >-
          Distancia (m) a unidade de conservacao da WDPA, roteada de feat_conservation pelo prefixo
          cv_; conectividade e consolidacao. A WDPA e camada de governanca, nao de cobertura da
          terra.
      cv_carbon:
        weight: 0.1734         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [10, 20]
        basis: empirico
        note: >-
          Estoque de carbono da biomassa; servico de armazenamento. Ressalva registrada: biomassa
          correlaciona-se com floresta, uma circularidade branda que mantem o peso deste fator
          abaixo do que sua variancia sugeriria.
      cv_ruggedness:
        weight: 0.1695         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [5, 30]
        basis: empirico
        note: >-
          Desvio-padrao da elevacao na vizinhanca (m); heterogeneidade de habitat e baixa aptidao
          agricola.
      terr_twi:
        weight: 0.0708         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points:
        - 9.44
        - 11.56
        basis: empirico
        note: >-
          Indice topografico de umidade; servico hidrico ripario e de recarga. Limiares no intervalo p10-p90 observado (9,44-11,56). Ancorar na distribuicao observada torna desnecessario o deslocamento manual que a mudanca da celula de captacao do HydroSHEDS exigia: se a escala nominal mudar, basta reexecutar tools/anchor_breakpoints.py.
      rl_native_frac:
        weight: 0.0692        # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [0.25, 0.85]
        basis: empirico
        note: >-
          Fracao de vegetacao nativa (papeis nativos do MapBiomas, creditando o Cerrado aberto),
          roteada pelo prefixo rl_. E a unica entrada de cobertura da terra sancionada em todo o
          modelo, e entra rebaixada justamente para nao tornar o indice circular.
      clim_aridity:
        weight: 0.0591        # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [0.95, 1.25]
        basis: empirico
        note: >-
          Indice de aridez P/PET; viabilidade de balanco hidrico. E a alavanca climatica do
          segmento: cai sob aquecimento, tornando a conservacao perdedora no CMIP6.
      terr_slope:
        weight: 0.0242         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [2.86, 11.31]
        basis: empirico
        note: "Declividade em graus; terreno marginal tem baixo custo de oportunidade para a conservacao."
      clim_twarm_q:
        weight: 0.0492         # machine-written by tools/derive_weights.py
        role: limiting
        type: decreasing
        points: [23, 31]
        basis: empirico
        note: >-
          Temperatura media do trimestre mais quente (C); estresse termico e de fogo. Segunda
          alavanca climatica do segmento.
      water_drain_density:
        weight: 0.0324         # machine-written by tools/derive_weights.py
        role: limiting
        type: increasing
        points: [0.01, 0.08]
        basis: empirico
        note: "Densidade de drenagem; servico hidrico ripario e de recarga."

