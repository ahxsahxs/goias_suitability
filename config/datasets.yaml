# Pinned Earth Engine dataset IDs, bands and scale factors (single source of truth).
# "scale" = multiply the raw stored band by this factor to get physical units.
# Territory-specific settings (AOI, municipal mesh, asset folder) live in
# config/territory.yaml; utils.cfg() merges them in as `asset` and `municipal_mesh`.

grid:
  scale_m: 250            # analysis resolution
  crs: EPSG:4326          # processing CRS (areas via ee.Image.pixelArea())
  baseline: [1991, 2020]  # WMO climate normal (leak-free reference for CMIP6 deltas)

# --- Part 2: climate & water balance ----------------------------------------
climate:
  terraclimate:
    id: IDAHO_EPSCOR/TERRACLIMATE
    period: ["1991-01-01", "2021-01-01"]   # exclusive end
    bands:                                  # scale -> physical unit
      pr:   {scale: 1.0,  unit: mm}
      pet:  {scale: 0.1,  unit: mm}
      def:  {scale: 0.1,  unit: mm}
      pdsi: {scale: 0.01, unit: index}
      soil: {scale: 0.1,  unit: mm}
      vpd:  {scale: 0.01, unit: kPa}
      srad: {scale: 0.1,  unit: W/m2}
      tmmx: {scale: 0.1,  unit: degC}
      tmmn: {scale: 0.1,  unit: degC}
      aet:  {scale: 0.1,  unit: mm}
  params:
    dry_month_pr_mm: 60     # a month counts as "dry" if mean P < this
    gdd_base_c: 10          # base temperature for growing-degree-days

# --- Part 3: terrain ---------------------------------------------------------
terrain:
  srtm: USGS/SRTMGL1_003
  hydrosheds_acc: WWF/HydroSHEDS/15ACC    # 15 arc-sec flow accumulation (band b1)
  tpi_radius_m: 500

# --- Part 4: soil (OpenLandMap, 250 m; 0-30 cm mean) ------------------------
soil:
  depths_bands: [b0, b10, b30]
  layers:
    clay: {id: "OpenLandMap/SOL/SOL_CLAY-WFRACTION_USDA-3A1A1A_M/v02", scale: 1.0,  unit: pct}
    sand: {id: "OpenLandMap/SOL/SOL_SAND-WFRACTION_USDA-3A1A1A_M/v02", scale: 1.0,  unit: pct}
    soc:  {id: "OpenLandMap/SOL/SOL_ORGANIC-CARBON_USDA-6A1C_M/v02",   scale: 5.0,  unit: "g/kg"}
    ph:   {id: "OpenLandMap/SOL/SOL_PH-H2O_USDA-4C1A2A_M/v02",         scale: 0.1,  unit: pH}
    bdod: {id: "OpenLandMap/SOL/SOL_BULKDENS-FINEEARTH_USDA-4A1H_M/v02", scale: 10.0, unit: "kg/m3"}
    awc:  {id: "OpenLandMap/SOL/SOL_WATERCONTENT-33KPA_USDA-4B1C_M/v02", scale: 1.0,  unit: pct}

# --- Part 5: hydrology & water access ---------------------------------------
water:
  gsw: JRC/GSW1_4/GlobalSurfaceWater
  occurrence_threshold: 80            # permanent water if occurrence > this
  seasonal_occurrence_threshold: 50   # semi-permanent water (>= ~6 mo), pisciculture siting
  hydrosheds_acc: WWF/HydroSHEDS/15ACC
  stream_acc_threshold: 1000          # flow-accum cells above which a pixel is a "stream"
  drainage_radius_m: 2500             # window for drainage density (stream fraction)

# Parts 6 and 7 are intentionally vacant (vegetation phenology and market access were
# removed: both encode current land use, see thesis §sec:feature-eng).

# --- Part 7b: ESA WorldCover classes (legacy generic mask; the pipeline's
# feat_landcover now comes from MapBiomas, see `mapbiomas:` below) ------------
landcover:
  worldcover: ESA/WorldCover/v200
  band: Map
  classes:
    tree: 10
    shrub: 20
    grass: 30
    crop: 40
    built: 50
    bare: 60
    snow: 70
    water: 80
    herb_wetland: 90
    mangrove: 95
    moss: 100
  excluded: [50, 80, 90]       # never eligible: built-up, water, herbaceous wetland
  available: [20, 30, 40, 60]  # generic convertible: shrub, grass, crop, bare

# --- Part 7d: conservation-value side bands (feat_conservation; NOT stacked) --
conservation:
  wdpa: WCMC/WDPA/current/polygons                    # protected areas (governance layer)
  biomass:                                            # Spawn et al. 2020 woody biomass carbon
    id: "NASA/ORNL/biomass_carbon_density/v1"
    band: agb                                         # Mg C/ha
  ruggedness_radius_px: 3                             # elevation-std window (250 m pixels)

# --- Part 11: CMIP6 delta-change projection (NASA NEX-GDDP-CMIP6) -------------
# Monthly change factors (ratio for pr, additive K delta for tasmax/tasmin) are
# applied to the TerraClimate 1991-2020 baseline (src/cmip6.py).
cmip6:
  id: NASA/GDDP-CMIP6
  bands: [pr, tasmax, tasmin]
  historical: [1991, 2014]      # NEX-GDDP historical ends 2014
  hargreaves_c: 17.8            # Hargreaves temperature constant; 0.0023*Ra cancels in the ratio
  scenarios: [ssp245, ssp585]
  windows:                      # name -> [start_year, end_year] inclusive
    "2031_2050": [2031, 2050]
    "2051_2070": [2051, 2070]
  models: [ACCESS-CM2, EC-Earth3, GFDL-ESM4, MPI-ESM1-2-HR, MRI-ESM2-0]

# --- Part 13: MapBiomas land use (Brazil-wide; mask + validation only) --------
# Class remap: config/mapbiomas_classes.yaml.
mapbiomas:
  asset: projects/mapbiomas-public/assets/brazil/lulc/collection10/mapbiomas_brazil_collection10_integration_v1
  asset_coll9: projects/mapbiomas-public/assets/brazil/lulc/collection9/mapbiomas_collection90_integration_v1
  band_pattern: classification_{year}
  current_year: 2024
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

# --- Part 14: MODIS MOD17 productivity proxy (validation only; never a feature)
productivity:
  npp: {id: MODIS/061/MOD17A3HGF, band: Npp, qa: Npp_QC, scale: 0.0001, unit: "gC/m2/yr"}
  gpp: {id: MODIS/061/MOD17A2HGF, band: Gpp, qa: Psn_QC, scale: 0.0001, unit: "kgC/m2"}   # gap-filled 8-day
  period: [2001, 2020]
