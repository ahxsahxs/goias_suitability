# =============================================================================
# Part 9 — AHP pairwise judgements (INPUT, hand-written)
# -----------------------------------------------------------------------------
# This file is an INPUT, not a generated artifact. It records, per segment, the
# declared basis of every pairwise comparison, and `tools/derive_weights.py`
# turns it into the matrix, the true principal eigenvector (w_lit), lambda_max,
# CI, RI and CR.
#
# Derivation chain:
#     anchors (here) -> matrix -> w_lit -> x sigma(mu)^lambda -> config/segments.yaml
#
# The hand-written surface is `anchors:` — ONE ordinal band per factor, plus the
# published priority `r` where a factor corresponds to a source criterion. Every
# a_ij is a deterministic function of those anchors (rules A/B/C below), so the
# author sets n ordinals per segment rather than n(n-1)/2 free matrix cells.
# That is what keeps the derivation from collapsing back into reverse-
# engineering a weight vector already chosen. See docs/ahp_literatura.md.
#
# Rules (enforced by derive_weights.py):
#   A  both factors anchored in the SAME source AND the same `block`:
#        a_ij = snap(r*_i / r*_j) on the integer Saaty scale, log-nearest.
#   B/C one or neither anchored, or cross-block/cross-source:
#        a_ij = ladder(band_j - band_i), ladder 0->1, 1->3, 2->5, 3->7.
#   band 1 = most important ... 4 = least. An anchored factor's band must sit in
#   the tercile of its own r within the source's criterion set.
#
# `factors:` lists only the factors that enter the matrix. Factors carrying
# `role: gate` in config/segments.yaml are effectively constant in GO/DF and
# are applied as a multiplicative gate instead — absent here by design.
# Gate criterion, measured not arbitrated (thesis/Chapters/factor_discrimination.csv):
#     sigma(mu) < 0.05  AND  mean(mu) > 0.95  over available land.
# BOTH conditions are required. sigma(mu) alone would also catch a factor that
# is near-uniform at a LOW mu — a genuine across-the-board penalty, not a
# plateau — and re-anchoring that to mu = 1 would silently raise the whole
# surface. That is why other_crops.clim_pr_cv (sigma = 0.047, mean mu = 0.694)
# stays weighted.
#
# Everything under `derived:` is written by tools/derive_weights.py. Do not edit
# it by hand; `derive_weights.py --check` fails if it drifts.
# =============================================================================

scale:
  allowed: [1, 2, 3, 4, 5, 6, 7, 8, 9]   # + reciprocals; integer Saaty only
  band_ladder: {0: 1, 1: 3, 2: 5, 3: 7}
  max_revisions_per_segment: 3
  cr_threshold: 0.10

