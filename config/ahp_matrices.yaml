# =============================================================================
# Part 9 — AHP pairwise judgements (INPUT, hand-written)
# -----------------------------------------------------------------------------
# This file is an INPUT, not a generated artifact. It records, per segment, the
# declared basis of every pairwise comparison, and `tools/derive_weights.py`
# turns it into the matrix, the true principal eigenvector (w_lit), lambda_max,
# CI, RI and CR.
#
# Derivation chain:
#     anchors (here) -> matrix -> w_lit -> x sigma_horizon(mu)^lambda -> config/segments.yaml
#
# The hand-written surface is `anchors:` — ONE ordinal band per factor, plus the
# published priority `r` where a factor corresponds to a source criterion. Every
# a_ij is a deterministic function of those anchors (rules A/B/C below), so the
# author sets n ordinals per segment rather than n(n-1)/2 free matrix cells.
# That is what keeps the derivation from collapsing back into reverse-
# engineering a weight vector already chosen. See docs/ahp_literatura.md.
#
# Rules (enforced by derive_weights.py):
#   A  both factors anchored in the SAME source AND the same `block`:
#        a_ij = snap(r*_i / r*_j) on the integer Saaty scale, log-nearest.
#   B/C one or neither anchored, or cross-block/cross-source:
#        a_ij = ladder(band_j - band_i), ladder 0->1, 1->3, 2->5, 3->7.
#   band 1 = most important ... 4 = least. An anchored factor's band must sit in
#   the tercile of its own r within the source's criterion set.
#
# `factors:` lists EVERY factor of the segment. There is no exempt category: the
# `role: gate` mechanism — a two-condition test (sigma(mu) < 0.05 AND mean(mu) >
# 0.95) that pulled a near-constant factor out of the matrix and re-applied it as
# a multiplicative gate — was removed on 2026-10-02. It bought a correct result
# (no hidden global deflator, CMIP6 lever preserved) at the price of an author
# conditional in the middle of a derivation whose whole point is not to have one.
# The single regional rule now does that work alone, with one caveat:
#
#   d = sigma_mu_horizon, measured over the PRESENT union the FUTURE
#       (SSP5-8.5, 2051–2070) rather than over the present alone.
#
# Measured over the present alone, the seven climate factors whose observed range
# sits inside their own optimal plateau have d = 0 EXACTLY, so w = w_lit * 0^lambda
# = 0, mu^0 = 1, and the factor leaves the product — worse than the gate, since it
# kills the deflator AND the CMIP6 lever. Over the horizon the question becomes
# "how much does this factor grade across the range it actually traverses within
# the analysis horizon", so a factor that is saturated today but moves under
# warming earns a weight instead of vanishing. Still one measured rule, still no
# author conditional.
#
# The alternative considered and declined: a floor sigma_min = epsilon on the
# present. Simpler to state, but it arbitrates an epsilon — exactly the
# subjectivity this change removes — and hands the full constant mu < 1 global
# deflator back to the FAO cuts, which are absolute.
#
# Everything under `derived:` is written by tools/derive_weights.py. Do not edit
# it by hand; `derive_weights.py --check` fails if it drifts.
# =============================================================================

scale:
  allowed: [1, 2, 3, 4, 5, 6, 7, 8, 9]   # + reciprocals; integer Saaty only
  band_ladder: {0: 1, 1: 3, 2: 5, 3: 7}
  max_revisions_per_segment: 3
  cr_threshold: 0.10

segments:

  soybean:
    factors: [terr_slope, soil_clay, soil_ph, clim_pr_annual, clim_twarm_q, clim_aridity]
    anchors:
      clim_pr_annual:
        band: 2
        r: 0.261
        rank: 2
        n_criteria: 6
        source: radocaj_optimal_2020
        locator: tab. 5, p. 13
        block: clima
        rationale: >-
          Precipitation; 2.º de 6 na matriz CLIMÁTICA da fonte (tercil superior). Fica na mesma faixa
          que o pH e o declive, e não acima, porque a própria fonte declara os grupos clima e solo
          igualmente influentes no resultado de aptidão (p. 7).
      clim_twarm_q:
        band: 3
        r: 0.082
        rank: 5
        n_criteria: 6
        source: radocaj_optimal_2020
        locator: tab. 5, p. 13
        block: clima
        rationale: >-
          Tmax, a média das máximas do trimestre quente na fonte; 5.º de 6 na matriz climática. O par
          com clim_pr_annual é de regra A -- r*(pr)/r*(twarm) = 3,18, que arredonda a 3 na escala de
          Saaty -- e não depende desta faixa.
      clim_aridity:
        band: 3
        rationale: >-
          author judgement -- índice de aridez (P/PET) como integrador do balanço hídrico que o total
          pluviométrico não captura. Ausente do conjunto de critérios de Radočaj et al., por isso
          entra como faixa ordinal e não como prioridade publicada; é a alavanca CMIP6 que combina
          chuva e demanda atmosférica no mesmo número.
      soil_ph:
        band: 2
        r: 0.254
        rank: 2
        n_criteria: 6
        source: radocaj_optimal_2020
        locator: tab. 6, p. 14
        block: solo
        rationale: pH; tercil superior da matriz de solo da fonte.
      terr_slope:
        band: 2
        r: 0.178
        rank: 3
        n_criteria: 6
        source: radocaj_optimal_2020
        locator: tab. 6, p. 14
        block: solo
        rationale: Slope; tercil intermediário da matriz de solo da fonte.
      soil_clay:
        band: 3
        r: 0.104
        rank: 4
        n_criteria: 6
        source: radocaj_optimal_2020
        locator: tab. 6, p. 14
        block: solo
        rationale: SoilTexture; tercil intermediário da matriz de solo da fonte.
