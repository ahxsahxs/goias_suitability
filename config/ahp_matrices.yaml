        band: 3
        source: aparecido_climate_2021
        locator: p. 777
        rationale: >-
          Duração da estação seca. A fonte trata o déficit hídrico como o mecanismo da perda de
          rendimento, mas na cana a maturação seca é desejável: o fator tem ótimo intermediário
          (pontos 3/5/5/9), não é monotónico, e fica por isso uma faixa abaixo do total pluviométrico.
