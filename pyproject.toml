[project]
name = "goias-suitability"
version = "0.1.0"
description = "Multi-segment agro-market suitability atlas and CMIP6-projected zoning of Goiás + Distrito Federal (Google Earth Engine-native)."
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies for the analysis pipeline (src/) and the headless tools/
# (figure rendering, calibration, validation, verification). Everything runs
# server-side in Earth Engine; these are the local-side libraries only.
dependencies = [
    "earthengine-api>=1.0",   # ee — server-side geoprocessing client
    "requests>=2.31",         # tools/make_figures.py — getThumbURL fetch
    "numpy>=1.26",
    "pandas>=2.1",            # table joins, CSV-based diagnostic figures
    "matplotlib>=3.7",        # figure composition (+ mpl_toolkits.axes_grid1)
    "pillow>=10.0",           # PIL — decode GEE PNG thumbnails
    "pyyaml>=6.0",            # config/*.yaml loaders (src/utils.py)
    "scikit-learn>=1.3",      # src/zoning.py offline KMeans/PCA, src/metrics.py
    "scipy>=1.11",            # src/metrics.py — spearmanr, f_oneway
    "geopandas>=1.1.4",       # geospatial files manipulation
    "GDAL<=3.8.4",           # GDAL binding
    "rio-pmtiles>=1.2.2",
    "ruamel.yaml>=0.18",      # tools/derive_weights.py — comment-preserving
                              # round-trip write-back of config/segments.yaml
]

[tool.uv]
# A set of scripts, not an installable package: pipeline.py and tools/ add src/ to
# sys.path themselves. uv only manages the environment.
package = false
